name: Genesis OS CI

on:
  push:
    paths:
      - 'genesis-os/**'
      - '.github/workflows/genesis-os-ci.yml'
  pull_request:
    paths:
      - 'genesis-os/**'
      - '.github/workflows/genesis-os-ci.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: genesis-os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: genesis-os/pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Byte-compile
        run: python -m compileall -q src tests
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: python -m genesis_os.cli demo
